name: Deploy to EC2

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      image-name:
        description: 'Docker image name to use'
        required: true
        default: 'springboot-java-app-pipeline'
        type: string
      image-tag:
        description: Docker Hub image tag to deploy (image name is springboot-java-app-pipeline)
        required: true
        default: 'latest'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment settings
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag."
            exit 1
          fi
          if [[ ! "$DOCKER_USERNAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "DOCKER_USERNAME is missing or invalid."
            exit 1
          fi
          if [[ -z "$EC2_HOST" || -z "$EC2_USER" || -z "$EC2_SSH_KEY" || -z "$DOCKER_PASSWORD" ]]; then
            echo "Configure EC2_HOST, EC2_USER, EC2_SSH_KEY, and DOCKER_PASSWORD as repository secrets."
            exit 1
          fi

      - name: Configure SSH (connect to EC2)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Install Docker on EC2 (if not installed)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_deploy_key "$EC2_USER@$EC2_HOST" "bash -s" <<'REMOTE'
          if ! command -v docker &> /dev/null; then
            echo "Docker not found. Installing Docker..."
            sudo apt-get update
            sudo apt-get install -y docker.io
            sudo systemctl enable docker
            sudo systemctl start docker
          else
            echo "Docker is already installed."
          fi
          REMOTE
      - name: Log in to Docker Hub on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          printf '%s' "$DOCKER_PASSWORD" | ssh \
            -i ~/.ssh/ec2_deploy_key \
            "$EC2_USER@$EC2_HOST" \
            "docker login --username '$DOCKER_USERNAME' --password-stdin"

      - name: Pull and run image on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          IMAGE="$DOCKER_USERNAME/${{inputs.image-name}}:$IMAGE_TAG"
          ssh -i ~/.ssh/ec2_deploy_key "$EC2_USER@$EC2_HOST" "IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          trap 'docker logout || echo "Warning: Docker Hub logout failed on EC2."' EXIT

          docker pull "$IMAGE"
          if docker container inspect spring-boot-app >/dev/null 2>&1; then
            docker rm -f spring-boot-app
          fi
          docker run -d \
            --restart unless-stopped \
            --name spring-boot-app \
            -p 8081:8081 \
            "$IMAGE"
          REMOTE
